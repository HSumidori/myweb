ype":"narration","text":"你抬头，目光撞上一双清亮的眼睛，心跳漏了半拍。"},{"type":"narration","text":"你脱口而出：没、没人，你坐吧，声音小得像蚊子叫。"},{"type":"dialogue","speaker":"char1","text":"谢谢，我叫李杰，以后请多关照。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她坐下时，短发末梢轻轻扫过你的手背，带着淡淡的洗发水香。"},{"type":"dialogue","speaker":"char1","text":"那个，我能开一下窗吗？教室里有点闷。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你慌忙点头，手肘撞到桌角，痛得倒吸凉气却强装镇定。"},{"type":"dialogue","speaker":"char1","text":"你没事吧？脸怎么突然红了？","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"narration","text":"你干咳一声，假装整理课本，嘴里含糊地说着没事。"},{"type":"narration","text":"第一堂课还没开始，你的课本已经拿倒了两次。"},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c1s2","ending":"","effects":{"affection.char1":1}}]}],"bgmName":"SIDNEY JOSEPH BECHET - Si tu vois ma mère","bgmVolume":0.2,"bgmLoop":true},{"id":"c1s2","chapter":1,"name":"纸条风波","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"周勇讲到《荷塘月色》，粉笔灰在黑板上簌簌落下。"},{"type":"narration","text":"李杰偷偷递来一张折成方块的纸条，指尖轻碰你手背。"},{"type":"narration","text":"你展开纸条，上面画着一只歪歪扭扭的猪头，还写着“像不像”。"},{"type":"dialogue","speaker":"char2","text":"李杰！你手里拿的什么？拿过来。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"char1","text":"没、没什么……就是草稿纸。","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"dialogue","speaker":"char2","text":"草稿纸？草稿纸你藏什么？给我看看。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"全班目光聚焦过来，刚子和猴子发出起哄的“哦——”。"},{"type":"dialogue","speaker":"char1","text":"周老师，纸条是我传的，不关他的事。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char2","text":"行啊，挺仗义。但是李杰，这猪头画的是谁？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"char4","text":"老周，那猪头确实挺像你的双下巴！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char2","text":"刚子！你给我站起来，下课来办公室。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"你脱口而出：不，是我让她传的，要罚就罚我，语气坚定。"},{"type":"choice","prompt":"","options":[{"text":"继续坚持是自己写的","goto":"c1s3","ending":"","effects":{"affection.char1":2,"flags.admit":true}},{"text":"改口说是李杰画的","goto":"c1s4","ending":"","effects":{"affection.char1":-2,"flags.blame":true}}]}]},{"id":"c1s3","chapter":1,"name":"天台密谈","background":"dorm","bgm":"assets/a-05f27e531f226d7c.mp3","lines":[{"type":"narration","text":"刚子和猴子一左一右架着你冲上天台，铁门在身后砰地关上。"},{"type":"dialogue","speaker":"char4","text":"兄弟，可以啊，开学第一天就让班花替你顶罪。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"就是，那纸条上到底写的啥？有没有表白？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"你连连摆手否认，说那只是她随手画的猪头而已。"},{"type":"dialogue","speaker":"char5","text":"切——我才不信，你俩眼神都拉丝了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"别装了，我们都看见你帮她开窗了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"你靠在栏杆上，风把校服下摆吹得鼓起来，像一面小旗。"},{"type":"narration","text":"你小声辩解：真没有，就是同桌之间互相帮助而已。"},{"type":"dialogue","speaker":"char5","text":"得了吧，李杰可没帮过别人。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"老实交代，你是不是对她有感觉？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"你沉默两秒，眼前好像又浮现出她递纸条时的样子。"},{"type":"dialogue","speaker":"char1","text":"那个……给你。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"别让老师看见哦。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"她低垂的睫毛轻轻颤了颤，你回过神来。"},{"type":"narration","text":"你犹豫着承认道：……好像，有那么一点点吧。"},{"type":"dialogue","speaker":"char4","text":"哟——！早说不就完了！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"那你得抓紧，咱班可不止你一个盯着她。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c1s4","ending":"","effects":{"affection.char1":1}}]}],"bgmName":"SIDNEY JOSEPH BECHET - Si tu vois ma mère","bgmVolume":0.2,"bgmLoop":true},{"id":"c1s4","chapter":1,"name":"英语课助攻","background":"classroom","bgm":"assets/a-05f27e531f226d7c.mp3","lines":[{"type":"narration","text":"英语课，杜晓葵的PPT上是一只戴着墨镜的猫，配文“cool cat”。"},{"type":"dialogue","speaker":"char3","text":"来，最后一排靠窗的同学，翻译一下这个句子。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"你站起来，大脑一片空白，同桌的李杰用笔杆轻轻戳你。"},{"type":"dialogue","speaker":"char1","text":"选C……主将从现……","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你犹豫了一下，不确定地开口：选C，声音有些发虚。"},{"type":"dialogue","speaker":"char3","text":"答对了，但刚才谁在当你的提词器啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"全班哄笑，李杰把脸埋进课本里，耳朵尖红透。"},{"type":"dialogue","speaker":"char3","text":"李杰，你干脆坐到他肩膀上去得了。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"老师，他们俩是不是很有CP感？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char3","text":"现在不兴叫CP，叫“学习互助小组”。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李杰在桌下踩了你一脚，你痛得吸气却不敢出声。"},{"type":"dialogue","speaker":"char1","text":"都怪你，认真听讲啊。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"你压低声音说：好，我以后不靠你提示了，自己努力。"},{"type":"dialogue","speaker":"char1","text":"……也不用完全不靠我。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c1s5","ending":"","effects":{}}]}],"bgmName":"SIDNEY JOSEPH BECHET - Si tu vois ma mère","bgmVolume":0.2,"bgmLoop":true},{"id":"c1s5","chapter":1,"name":"校门解围","background":"street","bgm":"assets/a-032f7a7041f4260b.mp3","lines":[{"type":"narration","text":"放学铃响，你走出校门，看见李杰被两个染黄毛的人堵在路边。"},{"type":"narration","text":"其中一个黄毛嬉皮笑脸：学妹，加个微信呗，哥哥请你喝奶茶。"},{"type":"dialogue","speaker":"char1","text":"我不认识你们，请让开。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"另一个黄毛凑近：别这么冷漠嘛，就交个朋友。"},{"type":"dialogue","speaker":"char1","text":"请你们离开，不然我喊人了。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"李杰攥紧书包带，眼神慌乱地四处张望，正好看见你。"},{"type":"narration","text":"她的目光像抓住救命稻草，却又迅速移开，似乎不想连累你。"},{"type":"narration","text":"你内心挣扎：上去帮她，可能会挨揍；装作没看见，又过不了自己这关。"},{"type":"dialogue","speaker":"char1","text":"别碰我！","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"黄毛A伸手要去拉李杰的胳膊，李杰侧身躲开。"},{"type":"narration","text":"你的拳头无意识地攥紧，心跳声擂在耳膜上。"},{"type":"choice","prompt":"","options":[{"text":"冲上前挡在李杰身前","goto":"c1s6","ending":"","effects":{"affection.char1":3,"flags.hero":true}},{"text":"大喊“警察来了”吓跑对方","goto":"c1s6","ending":"","effects":{"affection.char1":1,"flags.smart":true}},{"text":"低头快步离开","goto":"c1s7","ending":"","effects":{"affection.char1":-3,"flags.coward":true}}]}],"bgmName":"Andrea__all - L no Theme (from Death Note) (Drill Version)","bgmVolume":0.6,"bgmLoop":true},{"id":"c1s6","chapter":1,"name":"并肩同行","background":"street","bgm":null,"lines":[{"type":"narration","text":"你深吸一口气，上前一步，把李杰拉到身后，盯着两个黄毛。"},{"type":"narration","text":"你尽量让声音不抖：我已经报警了，校门口有监控。"},{"type":"narration","text":"黄毛B切了一声，满脸不屑：没意思，走。"},{"type":"narration","text":"两人骂骂咧咧地离开，你这才发现后背已被冷汗浸湿。"},{"type":"dialogue","speaker":"char1","text":"谢谢……我、我刚才好害怕。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你轻声安慰道：没事了，以后放学我们一起走。"},{"type":"narration","text":"这句话脱口而出，说完你自己先愣了两秒。"},{"type":"dialogue","speaker":"char1","text":"嗯……那说定了，好。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"夕阳把两条影子拉得很长，中间只隔着半拳距离。"},{"type":"narration","text":"你装作随意地问：你家住哪个方向啊？我送你。"},{"type":"dialogue","speaker":"char1","text":"就在前面那条街，拐个弯就到。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"一路无言，只有脚步声和偶尔响起的自行车铃。"},{"type":"dialogue","speaker":"char1","text":"明天……我还给你带早餐吧，当谢礼。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c1s7","ending":"","effects":{}}]}]},{"id":"c1s7","chapter":1,"name":"宿舍夜话","background":"dorm","bgm":null,"lines":[{"type":"narration","text":"宿舍熄灯后，刚子和猴子摸黑凑到你床边小声问。"},{"type":"dialogue","speaker":"char4","text":"老实交代，今天是不是跟李杰一起走的？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"你翻身背对着他们，闷声说：没有，只是顺路。"},{"type":"dialogue","speaker":"char5","text":"别装了，全年级都在传你和李杰在谈恋爱。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"你猛地坐起来，黑暗中耳根烫得能煎鸡蛋。"},{"type":"dialogue","speaker":"char4","text":"这反应，不说我还以为你已经表白了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"你低声解释：没有，我们只是同桌。"},{"type":"dialogue","speaker":"char5","text":"那她怎么总对你笑？今天还给你带早餐？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"你想起她说明天带早餐，嘴角不自觉翘了翘。"},{"type":"dialogue","speaker":"char4","text":"还笑！你小子就是嘴硬。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"你正色道：真没有，你们别瞎传，对人家女生不好。"},{"type":"dialogue","speaker":"char5","text":"那我们可要帮你一把，不能让李杰被别人抢了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"你翻身面朝墙壁，心跳声在黑暗里格外清晰。"},{"type":"dialogue","speaker":"char4","text":"睡吧睡吧，明天还要早起接受爱心投喂。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c1s8","ending":"","effects":{}}]}]},{"id":"c1s8","chapter":1,"name":"爱心早餐","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"早自习前，李杰拎着一个纸袋走进教室，放到你桌上。"},{"type":"dialogue","speaker":"char1","text":"给你带的，快趁热吃。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"纸袋里是还冒着热气的饭团和豆浆，全班目光“唰”地扫过来。"},{"type":"dialogue","speaker":"char4","text":"哇哦，爱心早餐！我们怎么没有？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"人家是同桌，你算哪根葱。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"你脸发烫，手指碰到纸袋时，李杰已经坐回座位翻开课本。"},{"type":"narration","text":"你低声说：谢谢，其实真的不用这么客气啊。"},{"type":"dialogue","speaker":"char1","text":"说了是谢礼，快吃吧。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你咬了一口饭团，余光里李杰的耳根也是红的。"},{"type":"dialogue","speaker":"char3","text":"哟，一大早就甜甜蜜蜜啊。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"全班哄笑，刚子带头鼓掌，李杰把脸埋进臂弯。"},{"type":"narration","text":"你急忙辩解：老师，我们真的只是同学而已！"},{"type":"dialogue","speaker":"char3","text":"我知道，同学之间的“友谊早餐”嘛。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"choice","prompt":"","options":[{"text":"大方承认对她有好感","goto":"c2s1","ending":"","effects":{"affection.char1":2,"flags.confess":true}},{"text":"坚持只是同学关系","goto":"c2s1","ending":"","effects":{"affection.char1":-1,"flags.deny":true}},{"text":"害羞地沉默","goto":"c2s1","ending":"","effects":{"affection.char1":1,"flags.shy":true}}]}]},{"id":"c2s1","chapter":2,"name":"河边分组","background":"river","bgm":null,"lines":[{"type":"narration","text":"河边风大，垃圾袋被吹得鼓起来，像一面投降的旗。"},{"type":"dialogue","speaker":"char1","text":"喂，你别光站着，帮我按住袋子。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"我赶紧蹲下，用膝盖压住袋口，水面倒影晃得人发晕。"},{"type":"dialogue","speaker":"char1","text":"这地方真脏，不过水挺清，能看到底下的石头。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她弯腰捡起一个塑料瓶，短发干净利落，发梢扫过我的手臂，痒痒的。"},{"type":"dialogue","speaker":"char1","text":"你觉不觉得，我们像在玩真人版扫雷？","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"我笑了，正要接话，猴子从远处扔来一个空易拉罐。"},{"type":"dialogue","speaker":"char5","text":"嘿，你俩别光顾着聊天，我们那边垃圾多着呢！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"猴子你乱扔垃圾，小心我告诉周老师。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"dialogue","speaker":"char5","text":"别别，我这是给你们制造任务，快夸我。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"刚子从后面踹了猴子一脚，两人打闹着跑远。"},{"type":"narration","text":"李杰摇摇头，把易拉罐踩扁丢进我的袋子里。"},{"type":"choice","prompt":"","options":[{"text":"认真捡垃圾，争取多聊几句","goto":"c2s2","ending":"","effects":{"affection.char1":2}},{"text":"故意放慢速度，等她主动开口","goto":"c2s2","ending":"","effects":{"affection.char1":1,"flags.ch2_river_slow":true}}]}]},{"id":"c2s2","chapter":2,"name":"谈心时刻","background":"river","bgm":null,"lines":[{"type":"narration","text":"垃圾捡得差不多，我们找了块大石头坐下，河水哗哗地流。"},{"type":"dialogue","speaker":"char1","text":"其实，我最近都不想回家。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"我怔了一下，转头看她，她正盯着水面发呆。"},{"type":"dialogue","speaker":"char1","text":"我妈天天念叨，让我一定要考上好大学，不然就对不起他们。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"我爸又总说，女孩子别那么拼，早点工作也行。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"我不知道该说什么，只好把刚捡的干净石头递给她。"},{"type":"dialogue","speaker":"char1","text":"干嘛？给我这个？","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"narration","text":"我小声说，这块石头在水里泡了很久，现在晒晒太阳会舒服点。"},{"type":"dialogue","speaker":"char1","text":"你这是什么歪理……不过，谢了。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"她接过石头，攥在手心，嘴角终于弯了弯。"},{"type":"narration","text":"风把她的刘海吹乱，我没有伸手去拨。"},{"type":"narration","text":"有些话不用说出口，光坐在旁边就够了。"},{"type":"choice","prompt":"","options":[{"text":"告诉她“你按自己的节奏来就好”","goto":"c2s3","ending":"","effects":{"affection.char1":2}},{"text":"转移话题，聊点学校的趣事","goto":"c2s3","ending":"","effects":{"affection.char1":1,"flags.ch2_avoid_topic":true}}]}]},{"id":"c2s3","chapter":2,"name":"主任警告","background":"office","bgm":null,"lines":[{"type":"narration","text":"春游回来第二天，我就被叫到了年级办公室。"},{"type":"dialogue","speaker":"char6","text":"最近有人反映，你和李杰走得太近。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我头皮一麻，手里攥着的垃圾袋还没扔。"},{"type":"dialogue","speaker":"char6","text":"你们现在是高三，什么最重要？是学习！","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char6","text":"李杰成绩不错，你别影响她。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我低着头，闻到自己身上还有河边的青草味。"},{"type":"dialogue","speaker":"char6","text":"我不是反对你们正常交往，但要注意分寸。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char6","text":"要是她下次考试退步，我第一个找你。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"我想解释，可李主任已经翻开教案，挥手让我出去。"},{"type":"narration","text":"转身时，我看见杜晓葵老师坐在角落，投来同情的目光。"},{"type":"choice","prompt":"","options":[{"text":"在意主任的话，决定暂时保持距离","goto":"c2s4","ending":"","effects":{"affection.char1":-1,"flags.ch2_distance":true}},{"text":"不以为意，继续和李杰正常相处","goto":"c2s4","ending":"","effects":{"affection.char1":1,"flags.ch2_defy":true}}]}]},{"id":"c2s4","chapter":2,"name":"天台对策","background":"rooftop","bgm":null,"lines":[{"type":"narration","text":"天台的风比河边还大，吹得校服猎猎作响。"},{"type":"dialogue","speaker":"char5","text":"听说老李找你谈话了？脸色这么差。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"别慌，主任就那德行，见谁和女生说话都像抓早恋。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"我靠在栏杆上，把主任的话复述了一遍。"},{"type":"dialogue","speaker":"char5","text":"这好办，你白天躲着李杰，晚上偷偷补课不就行了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"猴哥你能不能出点靠谱主意，还偷偷补课，像做贼。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"那你有什么高见？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"依我看，该干嘛干嘛，别被主任吓住。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char4","text":"你越躲，他越觉得你有鬼。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"我盯着楼下的操场，几个学弟在踢球，吵吵闹闹。"},{"type":"narration","text":"李杰不知什么时候站在了身后，我吓了一跳。"},{"type":"dialogue","speaker":"char1","text":"那个……李主任是不是批评你了？","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"她犹豫了一下，声音越来越小。"},{"type":"dialogue","speaker":"char1","text":"如果是因为我，对不起。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"我还没来得及解释，她已经转身下了楼。"},{"type":"dialogue","speaker":"char5","text":"大不了我们仨一起行动，人多显得正经。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我苦笑，心想主任看到我们仨围着李杰，怕是更头疼。"},{"type":"choice","prompt":"","options":[{"text":"采纳刚子的建议，顺其自然","goto":"c2s5","ending":"","effects":{"affection.char1":1}},{"text":"采纳猴子的建议，暂时减少接触","goto":"c2s5","ending":"","effects":{"affection.char1":-1,"flags.ch2_sneaky":true}}]}]},{"id":"c2s5","chapter":2,"name":"英语失利","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"英语课代表把卷子发下来，李杰低头看了一眼，没说话。"},{"type":"narration","text":"我偷瞄她的分数，比上次低了二十分。"},{"type":"dialogue","speaker":"char3","text":"这次小测，有些同学波动比较大。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char3","text":"高三每一分都很关键，课后要多下功夫。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"杜老师的目光扫过来，在我和李杰之间停了一秒。"},{"type":"dialogue","speaker":"char1","text":"（小声）又没考好……","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"老师，我最近状态不好，下次会努力。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char3","text":"李杰，你基础不差，找个同学互相督促会更好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"知道了，老师。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"我感觉到她轻轻踢了我椅子一下。"},{"type":"narration","text":"下课铃响，李杰把卷子折成小方块塞进笔袋。"},{"type":"narration","text":"我想起主任的警告，又想起河边她攥着石头的样子。"},{"type":"choice","prompt":"","options":[{"text":"主动提出帮她补习英语","goto":"c2s6","ending":"","effects":{"affection.char1":2}},{"text":"等杜老师安排，自己不主动","goto":"c2s6","ending":"","effects":{"affection.char1":0,"flags.ch2_passive":true}}]}]},{"id":"c2s6","chapter":2,"name":"教室补习","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"放学后，教室里只剩我们两个，日光灯嗡嗡响。"},{"type":"dialogue","speaker":"char1","text":"你真的要给我讲题？你英语也不怎么样吧。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"我把昨晚熬夜准备的错题本推过去，她翻开，眼睛亮了。"},{"type":"dialogue","speaker":"char1","text":"你竟然做了笔记？还是彩色的。","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"narration","text":"我不好意思地挠头，说为了不丢脸，临时突击的。"},{"type":"dialogue","speaker":"char1","text":"谢了，这比老师讲的清楚多了。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"她低头写题，短发干净利落，露出认真的侧脸。"},{"type":"narration","text":"我假装看窗外，玻璃上映出她握笔的手。"},{"type":"dialogue","speaker":"char1","text":"这道题选A还是C？我总觉得两个都对。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"我凑过去，两人的影子在课桌上叠在一起。"},{"type":"narration","text":"时间过得很快，走廊上传来值日生拖地的声音。"},{"type":"narration","text":"收拾书包时，她突然说，下次还能不能继续。"},{"type":"choice","prompt":"","options":[{"text":"笑着说“随叫随到”","goto":"c2s7","ending":"","effects":{"affection.char1":2}},{"text":"犹豫一下说“看情况吧”","goto":"c2s7","ending":"","effects":{"affection.char1":-1,"flags.ch2_hesitate":true}}]}]},{"id":"c2s7","chapter":2,"name":"分别赠礼","background":"street","bgm":null,"lines":[{"type":"narration","text":"校门口的路灯亮起来，把两个人的影子拉得老长。"},{"type":"dialogue","speaker":"char1","text":"这个，给你。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"她摊开手，掌心里躺着一个毛绒小挂件，是个歪嘴笑的河马。"},{"type":"dialogue","speaker":"char1","text":"今天路过文具店，觉得它傻乎乎的，跟你挺像。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"我接过来，河马的鼻子软塌塌的，还带着她手心的温度。"},{"type":"narration","text":"我翻遍口袋，只找到一颗水果糖，递过去算是回礼。"},{"type":"dialogue","speaker":"char1","text":"苹果味的？我喜欢。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"她剥开糖纸放进嘴里，腮帮子鼓起来，像那只河马。"},{"type":"dialogue","speaker":"char1","text":"明天见。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她转身跑进人群，短发在风里轻轻扬起，很快看不见了。"},{"type":"narration","text":"我站在路灯下，把挂件举到眼前，傻笑了好几次。"},{"type":"narration","text":"远处传来猴子的口哨声，刚子和猴子从树后探出头。"},{"type":"choice","prompt":"","options":[{"text":"把挂件挂在书包上，昂首走回宿舍","goto":"c2s8","ending":"","effects":{"affection.char1":2,"flags.ch2_charm_public":true}},{"text":"把挂件藏进口袋，装作没事发生","goto":"c2s8","ending":"","effects":{"affection.char1":1,"flags.ch2_charm_secret":true}}]}]},{"id":"c2s8","chapter":2,"name":"挂件与起哄","background":"dorm","bgm":null,"lines":[{"type":"narration","text":"宿舍熄灯后，我躺在床上，把河马挂件举到眼前。"},{"type":"dialogue","speaker":"char5","text":"哟，这都看半小时了，挂件能开花啊？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"别理他，他那是羡慕。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"我羡慕个鬼，我又没收到女生礼物。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我翻了个身，把挂件压在枕头底下，嘴角压不住。"},{"type":"dialogue","speaker":"char4","text":"说真的，李杰对你挺好的，你可得把握住。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"就是，别让主任几句话就给吓怂了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我嗯了一声，想起河边她攥着石头的侧脸。"},{"type":"dialogue","speaker":"char1","text":"（回忆）下次补习，你可别又迟到。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"（回忆）还有，别让主任抓到。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"dialogue","speaker":"char5","text":"不过补习也有风险，英语老师不会也盯上你俩吧？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"你少乌鸦嘴，睡觉睡觉。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"我闭上眼睛，手指碰到挂件，心里踏实得像揣了团棉花。"},{"type":"narration","text":"窗外的月光漏进来，把挂件的影子投在墙上，晃了晃。"},{"type":"choice","prompt":"","options":[{"text":"把挂件收进枕头下，决定明天认真听课","goto":"c3s1","ending":"","effects":{"affection.char1":1,"flags.ch2_resolve":true}},{"text":"把挂件挂到床头，大声宣布“我要追她”","goto":"c3s1","ending":"","effects":{"affection.char1":2,"flags.ch2_declare":true}}]}]},{"id":"c3s1","chapter":3,"name":"谣言四起","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"早自习的铃还没响，教室里已经像炸了锅。我刚坐下，几道目光就追了过来。"},{"type":"dialogue","speaker":"char4","text":"行啊兄弟，不声不响泡上班花了，连我们都瞒着。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"就是，还约人家小树林散步，全校都传遍了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"哪来的班花？我连她叫什么都不知道。"},{"type":"narration","text":"我扭头去看李杰，她正低头整理课本，手指在封面上划来划去。"},{"type":"dialogue","speaker":"char1","text":"麻烦让一下。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"我出去。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她从我身边挤过去，带起一阵风，没看我一眼。"},{"type":"dialogue","speaker":"char4","text":"完了，嫂子这是吃醋了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"快去追啊，愣着干嘛！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"我攥紧拳头，脑子里乱成一团。追上去，还是先弄清楚谣言从哪来的？"},{"type":"choice","prompt":"","options":[{"text":"追上去解释清楚","goto":"c3s2","ending":"","effects":{"affection.char1":2}},{"text":"先留在教室冷静","goto":"c3s3","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c3s2","chapter":3,"name":"天台质问","background":"rooftop","bgm":null,"lines":[{"type":"narration","text":"李杰背对着我站在围栏边，一头干净短发被风吹得微微扬起，校服下摆猎猎作响。"},{"type":"dialogue","speaker":"char1","text":"你还跟来干什么？不去陪你的绯闻女友吗？","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"我喉咙发干，想上前一步，却像被她的目光钉在原地。"},{"type":"dialogue","speaker":"char1","text":"日记的事，是不是你传出去的？现在全班都在看我的笑话。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"我想解释那只是误会，但李杰猛地转过身，眼眶微微发红。"},{"type":"dialogue","speaker":"char1","text":"说话啊！平时不是挺能编的吗？现在怎么哑巴了？","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"她的质问像连珠炮，每一个字都砸在我心上。"},{"type":"dialogue","speaker":"char1","text":"我真是看错你了。亏我还以为你和别人不一样。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"沉默像铅块一样压下来，只有风声在耳边呼啸。"},{"type":"choice","prompt":"","options":[{"text":"“李杰，你听我解释，事情不是你想的那样。”","goto":"c3s3","ending":"","effects":{"affection.char1":3}},{"text":"“……”（沉默）","goto":"c3s3","ending":"","effects":{"affection.char1":1}},{"text":"“那你为什么不信我？”","goto":"c3s4","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c3s3","chapter":3,"name":"不欢而散","background":"rooftop","bgm":null,"lines":[{"type":"narration","text":"我张了张嘴，喉咙像被什么东西堵住，只能挤出几个毫无意义的音节。"},{"type":"dialogue","speaker":"char1","text":"解释啊？你不是最会编故事吗？现在给我编一个啊！","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"我脑子里一片混乱，那些平时张口就来的谎话此刻全成了浆糊。"},{"type":"dialogue","speaker":"char1","text":"……算了。看你这样，我真是多余问。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她别过脸去，声音低了下去，像是在对自己说。"},{"type":"dialogue","speaker":"char1","text":"日记上写的果然没错，你接近我就是为了打赌。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"我急了，伸手想抓住她的手腕，却被她躲开。"},{"type":"dialogue","speaker":"char1","text":"别碰我！我不想再听你任何解释了。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"李杰退后一步，眼睛里全是失望。"},{"type":"narration","text":"她转身往楼梯口走去，脚步快得像是要逃离这里。"},{"type":"dialogue","speaker":"char1","text":"以后，我们别再说话了。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"她的背影消失在天台门后，只剩下我一个人站在原地。"},{"type":"narration","text":"风声更大了，吹得校服猎猎作响。我看着空荡荡的天台，懊悔像潮水一样涌来。"},{"type":"narration","text":"我到底在干什么？明明不是那样，却连一句像样的解释都说不出来。"},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c3s4","ending":"","effects":{}}]}]},{"id":"c3s4","chapter":3,"name":"班主任谈话","background":"office","bgm":null,"lines":[{"type":"narration","text":"主角被叫到办公室，推门看见周勇坐在椅子上翻作业本，表情不悦。"},{"type":"dialogue","speaker":"char2","text":"来了？把门带上，坐下。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"主角关好门，老老实实坐下。周勇抬头，目光像要把人看穿。"},{"type":"dialogue","speaker":"char2","text":"知道今天为什么叫你来吗？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"主角摇头，心里已经猜到七八分，额头冒汗。"},{"type":"dialogue","speaker":"char2","text":"李杰最近上课总走神，这次月考掉了二十多名。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"周勇把成绩单推到主角面前，手指重重敲了敲。"},{"type":"dialogue","speaker":"char2","text":"你和她走得近，是不是有什么事瞒着老师？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"主角支支吾吾，想起昨天李杰失望离开的背影，喉头发紧。"},{"type":"dialogue","speaker":"char2","text":"我不反对你们交朋友，但高三了，别互相耽误。尤其是你，别影响她。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"周勇语气加重，办公室空气都安静了。主角低头，手指绞着衣角。"},{"type":"dialogue","speaker":"char2","text":"她本来能冲重点的，你心里有数。回去好好想想。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"周勇摆摆手，主角如蒙大赦，转身逃离办公室。"},{"type":"narration","text":"走出办公室，主角靠在墙边，满脑子都是李杰转身时失望的眼神。"},{"type":"choice","prompt":"","options":[{"text":"立刻回宿舍找刚子猴子商量","goto":"c3s5","ending":"","effects":{"affection.char1":2}},{"text":"先去天台吹吹风冷静一下","goto":"c3s2","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c3s5","chapter":3,"name":"兄弟支招","background":"dorm","bgm":null,"lines":[{"type":"narration","text":"宿舍里刚子正叼着辣条打游戏，见主角回来，立刻把耳机摘了。"},{"type":"dialogue","speaker":"char4","text":"咋样啊？老周找你肯定没憋好屁吧？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"别慌，先喝口水，哥几个替你分析分析。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角把办公室对话复述了一遍，刚子的键盘敲得啪啪响。"},{"type":"dialogue","speaker":"char4","text":"这不明摆着吗？李杰状态差，你得负责啊！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"就是，你怂啥？直接搞个大新闻，让她重新注意你。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"猴子眼珠一转，凑过来压低声音。"},{"type":"dialogue","speaker":"char4","text":"要不你明天英语课整点活？杜老师最烦人开小差。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"对，你假装认真回答问题，再故意答错，全班一乐。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角犹豫，觉得这办法有点冒险，但刚子已经拍板。"},{"type":"dialogue","speaker":"char4","text":"犹豫啥？再不动手，李杰就被别人追走了！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"就是，先混个脸熟，后面再慢慢解释。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"宿舍夜谈结束，主角躺在床上盯着天花板，心里七上八下。"},{"type":"narration","text":"手机屏幕突然亮起，是李杰发来的消息。"},{"type":"dialogue","speaker":"char1","text":"今天谢谢你帮我说话，老周没为难你吧？","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"早点休息，别想太多。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"choice","prompt":"","options":[{"text":"听兄弟的，明天英语课整活。","goto":"c3s6","ending":"","effects":{"affection.char1":2}},{"text":"还是稳一点，别惹杜老师。","goto":"c3s7","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c3s6","chapter":3,"name":"课堂搞砸","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"第二天，阳光斜切进教室，英语课开始。主角盯着课本，脑子里全是昨晚刚子的话。"},{"type":"dialogue","speaker":"char3","text":"早上好，今天我们复习虚拟语气，翻开课本42页。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角手心冒汗，决定豁出去了——先混个脸熟。"},{"type":"dialogue","speaker":"char3","text":"这个问题谁来回答？就你吧，后面那个走神的男生。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角一个激灵站起来，脱口而出“我...我想...”却卡住了，最后憋出一句“老师，这题选C。”"},{"type":"dialogue","speaker":"char3","text":"选C？你倒是会蒙。我问的是翻译句子，你选什么C？坐下吧，下课来我办公室。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"教室里响起几声偷笑，主角感觉脸烫得能煎鸡蛋。"},{"type":"dialogue","speaker":"char1","text":"……","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"李杰回头看了他一眼，嘴角微微翘起，又迅速转了回去。"},{"type":"dialogue","speaker":"char1","text":"……","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"兄弟，你这脸熟混得够深刻。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"牛啊，直接预定办公室一日游。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角恨不得把头埋进桌肚里，但心里又有点庆幸——至少李杰看过来了。"},{"type":"choice","prompt":"","options":[{"text":"冲李杰做个鬼脸，试图缓解尴尬","goto":"c3s7","ending":"","effects":{"affection.char1":2}},{"text":"低头装死，祈祷大家快点忘记","goto":"c3s7","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c3s7","chapter":3,"name":"校门误会","background":"street","bgm":null,"lines":[{"type":"narration","text":"下课铃响，主角耷拉着脑袋走出教学楼，在校门口那棵老槐树下停住。"},{"type":"dialogue","speaker":"char4","text":"喂，你杵这儿当门神呢？等谁啊？","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"主角没回头，目光依旧在校门内扫来扫去，嘴里嘟囔了句“等李杰”。"},{"type":"dialogue","speaker":"char5","text":"哟，刚被杜老师训完就来找女神，勇气可嘉啊！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角正要反驳，校门里晃出两个身影——李杰正和一个高个男生有说有笑地往外走。"},{"type":"dialogue","speaker":"char1","text":"别闹了，书包带都要被你弄掉了。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"那个男生穿着隔壁班的校服，笑着收回手，两人并肩朝公交站方向走去。"},{"type":"dialogue","speaker":"char1","text":"那就这么说定啦，周末老地方见。","pose":"center","sprite":"smug","enter":false,"exit":false},{"type":"narration","text":"这句话像根针，扎得主角眼皮一跳。旁边刚子和猴子也安静下来，偷偷观察他的脸色。"},{"type":"dialogue","speaker":"char5","text":"老大，这……这什么情况？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角没答话，只是死死盯着那两人远去的背影，喉咙里像堵了团棉花。"},{"type":"choice","prompt":"","options":[{"text":"冲上去问清楚","goto":"c3s8","ending":"","effects":{"affection.char1":1}},{"text":"默默离开","goto":"c3s8","ending":"","effects":{"affection.char1":3}}]}]},{"id":"c3s8","chapter":3,"name":"河边偶遇","background":"river","bgm":null,"lines":[{"type":"narration","text":"暮色压着河面，水波把路灯揉成碎金。他踢开脚边的石子，看着它滚进草丛里。"},{"type":"narration","text":"校门口那一幕像根刺，扎在胸口。他深吸一口气，却吐不出那股闷劲。"},{"type":"dialogue","speaker":"char6","text":"高三（10）班的，一个人在这儿演什么苦情戏呢？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角猛地回头，李主任背着手站在堤岸上，镜片反着最后一丝天光。"},{"type":"dialogue","speaker":"char6","text":"别一副天塌下来的样子。我当了二十年教导主任，你们这点小九九，我瞄一眼就知道。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任弯腰捡起一块扁石，抖腕甩出去。石片在水面连跳三下，荡开一圈圈涟漪。"},{"type":"dialogue","speaker":"char6","text":"听说你今天在校门口站了半小时？等人啊？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角别过脸，耳朵却竖了起来。"},{"type":"dialogue","speaker":"char6","text":"年轻人，有些事啊，就像这河水，看着混，其实沉淀一晚上就清了。你现在急着搅，只会越来越浑。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"晚风从河面吹来，带着水草的气息。主角忽然觉得胸口没那么堵了。"},{"type":"dialogue","speaker":"char6","text":"误会这东西，最怕憋着。你要么当面问清楚，要么就信自己眼睛。但眼睛啊，有时候也会骗人。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任拍拍他的肩，转身往岸上走。走了几步又回头。"},{"type":"dialogue","speaker":"char6","text":"对了，明天英语早读别迟到。杜老师最近脾气可不太好。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任的身影消失在堤岸尽头。主角刚想离开，身后传来脚步声。"},{"type":"dialogue","speaker":"char1","text":"你怎么一个人在这儿？","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"主角张了张嘴，却不知从何说起。"},{"type":"dialogue","speaker":"char1","text":"今天校门口的事……我都看到了。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"主角别过脸，喉结动了动。"},{"type":"dialogue","speaker":"char1","text":"如果你愿意听，我可以解释。但别一个人闷着。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"河风撩起她的发丝，主角忽然觉得有些话明天再说也不迟。"},{"type":"choice","prompt":"","options":[{"text":"给李杰发消息，约她见面聊聊","goto":"c4s1","ending":"","effects":{"affection.char1":2}},{"text":"还是先回宿舍，明天找机会问清楚","goto":"c4s1","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c4s1","chapter":4,"name":"偷听真相","background":"office","bgm":null,"lines":[{"type":"narration","text":"第二天一早，主角没去教室，鬼使神差走到年级办公室门口。门虚掩着，里面传出杜老师和周老师的声音。"},{"type":"dialogue","speaker":"char2","text":"杜老师，那本恋爱日记你看了没？现在学生传得可邪乎了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"char3","text":"周老师，您怎么也信这个？那就是几个男生瞎写的，我那天亲眼看见刚子塞进李杰书包里。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角贴在门边，心跳突然快了一拍。"},{"type":"dialogue","speaker":"char2","text":"瞎写的？那怎么写得有鼻子有眼的？还说你跟李杰因为日记闹矛盾了？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"char3","text":"我那天是骂了她，因为她上课看小说，不是日记。现在的学生啊，就知道以讹传讹。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角的拳头慢慢松开，原来一切都是误会。他忽然想起李主任昨晚的话。"},{"type":"dialogue","speaker":"char3","text":"李杰那孩子最近压力挺大，你们当老师的别总捕风捉影。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char2","text":"行行行，我回头跟班上说说，让他们别乱传了。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"主角深吸一口气，心里已经有了决定。"},{"type":"choice","prompt":"继续","options":[{"text":"继续","goto":"c4s2","ending":"","effects":{}}]}]},{"id":"c4s2","chapter":4,"name":"天台告白","background":"rooftop","bgm":null,"lines":[{"type":"narration","text":"你冲上天台，看到李杰背对着你站在栏杆边，肩膀在发抖。"},{"type":"dialogue","speaker":"char1","text":"你别过来……我现在谁都不想见。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"你慢慢走近，轻声说：“我听到老师们的对话了，那都是误会。”"},{"type":"dialogue","speaker":"char1","text":"误会？你信吗？全校都在传是我倒贴，连你也躲着我……","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"李杰转过身，泪痕未干，声音里带着委屈和倔强。"},{"type":"dialogue","speaker":"char1","text":"我根本没有喜欢过那个谁！要不是你昨天不理我，我也不会一个人躲在这里哭。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"你心里一阵刺痛，上前一步，想要解释。"},{"type":"dialogue","speaker":"char1","text":"（后退一步）你走开！既然你都不信我，还来找我干嘛？","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"你一把拉住她的手，将她拽进怀里。"},{"type":"dialogue","speaker":"char1","text":"放开我！你……你干什么啊！","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"narration","text":"你抱得更紧，低声说：“对不起，是我不好。我不该怀疑你。”"},{"type":"dialogue","speaker":"char1","text":"（身体僵了一下，渐渐不再挣扎）真的……你真的相信我？","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你点点头，轻轻擦去她脸上的泪。"},{"type":"dialogue","speaker":"char1","text":"（把脸埋在你胸口，闷闷地说）那以后不准再不理我了……","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"你笑了，摸摸她的头：“不会了，我保证。”"},{"type":"choice","prompt":"","options":[{"text":"抱紧她，低声说：“以后不会再让你一个人。”","goto":"c4s3","ending":"","effects":{"affection.char1":2}},{"text":"松开手，认真看她：“我永远站在你这边。”","goto":"c4s4","ending":"","effects":{"affection.char1":3}}]}]},{"id":"c4s3","chapter":4,"name":"兄弟偷看","background":"rooftop","bgm":null,"lines":[{"type":"narration","text":"天台的风还没停，李杰的抽泣声渐渐低下去，两人还保持着拥抱的姿势。"},{"type":"narration","text":"通往天台的铁门后，刚子和猴子正叠着脑袋偷看，眼睛瞪得溜圆。"},{"type":"dialogue","speaker":"char4","text":"我靠，真抱上了！这日记神了！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"嘘！你想死啊？被发现咱俩就完了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"两人蹑手蹑脚想靠近，刚子却一脚踢翻了墙角的空水瓶。"},{"type":"dialogue","speaker":"char1","text":"谁在那儿？！","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"完了，快跑！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"跑个屁，天台就一个出口！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"两人只好从掩体后挪出来，脸上挂着比哭还难看的笑。"},{"type":"dialogue","speaker":"char1","text":"你们……偷看多久了？","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"没、没偷看，我们上来找……找信号！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"对，天台信号好，我们打电话呢。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"打电话要蹲在水箱后面？","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"刚子和猴子对视一眼，同时指向对方：“他拉我来的！”"},{"type":"dialogue","speaker":"char1","text":"够了！你们两个给我过来！","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"天台上响起两声哀嚎，刚子和猴子被李杰追得满场跑。"},{"type":"choice","prompt":"","options":[{"text":"帮兄弟打掩护，说他们只是路过","goto":"c4s4","ending":"","effects":{"affection.char1":2}},{"text":"趁机逗李杰，说他们专程来看你哭","goto":"c4s4","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c4s4","chapter":4,"name":"公开关系","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"刚子和猴子在教室门口偷看主角与李杰和好，被主角回头发现，两人慌忙钻进座位。"},{"type":"dialogue","speaker":"char4","text":"大哥，我们什么都没看见！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"对对对，我们就是路过！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角牵着李杰走进教室，全班目光齐刷刷看过来。主角清了清嗓子，大声宣布：“我们在一起了。”"},{"type":"dialogue","speaker":"char1","text":"你、你喊那么大声干嘛！","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"哇——大嫂好！以后我们就是你的小弟了！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"兄弟们，以后咱们就是娘家人了！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"教室里炸开了锅，笑声、起哄声此起彼伏。不知谁喊了一句“亲一个”，气氛更热了。"},{"type":"dialogue","speaker":"char2","text":"吵什么吵？整个楼道就听见咱们班！……你们俩，什么情况？","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"dialogue","speaker":"char1","text":"周老师……我们……我们在一起了……","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"主角坦然地握住李杰的手，对周勇说：“老师，我们在一起了。”"},{"type":"dialogue","speaker":"char2","text":"高三了你们知道吗……算了，别影响学习，低调点。","pose":"center","sprite":"default","enter":false,"exit":false,"spriteScale":1.5,"spriteY":30},{"type":"narration","text":"周勇摇摇头，走回讲台，算是默许了这桩“公开关系”。"},{"type":"choice","prompt":"","options":[{"text":"起哄让主角请客","goto":"c4s5","ending":"","effects":{"affection.char1":1}},{"text":"帮主角解围，说会好好学习","goto":"c4s6","ending":"","effects":{"affection.char1":3}},{"text":"默默记下，不作声","goto":"c4s7","ending":"","effects":{"affection.char1":2}}]}]},{"id":"c4s5","chapter":4,"name":"英语课表白","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"上课铃响，杜晓葵抱着一摞卷子进教室，看到主角和李杰同桌，挑了挑眉。"},{"type":"dialogue","speaker":"char3","text":"哎哟，刚公开关系就来上我的课啦？英语课可得有点国际范儿。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char4","text":"老师！让他用英语表白！","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"dialogue","speaker":"char5","text":"对对，李杰可是英语课代表！","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"dialogue","speaker":"char3","text":"好主意。来，你，站起来，用英语对李杰说句“I love you”。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"全班起哄，李杰耳朵通红，低头假装翻书。"},{"type":"dialogue","speaker":"char3","text":"别害羞，跟着我念：I have a crush on you.","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"主角结结巴巴地照说，发音歪得全班哄笑。"},{"type":"dialogue","speaker":"char1","text":"（小声）你发音好烂……","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"dialogue","speaker":"char3","text":"李杰，用英语回应一下？不然我们全班不答应。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"I... I like you too...","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"刚子和猴子带头起哄，教室里一片“哦哦哦”。"},{"type":"dialogue","speaker":"char3","text":"行了行了，这就是最好的情景教学。打开课本七十三页。","pose":"center","sprite":"default","enter":fa false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"猴子从床上探出脑袋，一脸坏笑。"},{"type":"dialogue","speaker":"char5","text":"可以啊兄弟，进展神速！我们是不是该改口叫嫂子了？","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"主角被说得有点不好意思，但心里挺高兴。"},{"type":"dialogue","speaker":"char4","text":"不过说真的，离高考没多少天了，你可别光顾着谈恋爱，把学习落下了。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"猴子也收起玩笑，认真点头。"},{"type":"dialogue","speaker":"char5","text":"对，李杰成绩那么好，你也不想拖后腿吧？赶紧把模拟卷做了。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"手机震动，是李杰发来的消息。"},{"type":"dialogue","speaker":"char1","text":"你到宿舍了吗？今天谢谢你陪我。","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"明天也一起走吧？","pose":"center","sprite":"shy","enter":false,"exit":false},{"type":"narration","text":"主角回复了一个“好”字，心里暖暖的。"},{"type":"narration","text":"主角点点头，打开台灯，拿出习题册。"},{"type":"dialogue","speaker":"char4","text":"这才对嘛！恋爱要谈，书也要读，两不耽误。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"choice","prompt":"","options":[{"text":"周末约李杰去河边散步","goto":"c4s8","ending":"","effects":{"affection.char1":2}},{"text":"还是先复习吧，高考要紧","goto":"c4s5","ending":"","effects":{"affection.char1":1}}]}]},{"id":"c4s8","chapter":4,"name":"河边约会","background":"river","bgm":null,"lines":[{"type":"narration","text":"周末的河边，你远远看见李杰站在柳树下朝你挥手，短发被风吹得轻轻扬起。"},{"type":"dialogue","speaker":"char1","text":"你迟到了！我还以为你不来了。","pose":"center","sprite":"angry","enter":false,"exit":false},{"type":"narration","text":"你笑着道歉，两人并肩沿着河岸走。李杰聊起最近的模拟考，语气里透着疲惫。"},{"type":"dialogue","speaker":"char1","text":"难得出来透透气，这里的风真舒服……欸，你看那朵云像不像兔子？","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"narration","text":"正说笑着，你忽然看见李主任从对面走来，脸色不太好看。"},{"type":"dialogue","speaker":"char1","text":"糟了，是李主任！我们怎么办？","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"narration","text":"李主任已经走到你们面前，李杰低头绞着手指，你只能硬着头皮打招呼。"},{"type":"dialogue","speaker":"char6","text":"周末不复习，跑河边来谈恋爱？你们倒是胆大。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"李主任，我们……只是出来走走……","pose":"center","sprite":"surprised","enter":false,"exit":false},{"type":"dialogue","speaker":"char6","text":"行了，别编了。我教了二十年书，还看不出你们这点事？","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"你心里一紧，正准备认错，李主任却叹了口气，语气意外地缓和下来。"},{"type":"dialogue","speaker":"char6","text":"高三了，压力大，有人互相鼓励不是坏事。但前提是成绩不能掉。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"dialogue","speaker":"char1","text":"我们保证不会耽误学习！请相信我们。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char6","text":"记住，下次月考谁退步，我就找谁家长。好了，玩一会儿就回去复习。","pose":"center","sprite":"default","enter":false,"exit":false},{"type":"narration","text":"李主任摆摆手走了。李杰长舒一口气，冲你吐了吐舌头。"},{"type":"choice","prompt":"","options":[{"text":"“李主任说得对，我们一起加油。”","goto":"c5s1","ending":"","effects":{"affection.char1":3}},{"text":"“今天运气真好，居然没被骂。”","goto":"c5s1","ending":"","effects":{"affection.char1":1}},{"text":"“下次考试，我一定考到年级前三十。”","goto":"c5s1","ending":"","effects":{"affection.char1":4}}]}]},{"id":"c5s1","chapter":5,"name":"文化祭筹备","background":"classroom","bgm":null,"lines":[{"type":"narration","text":"午后的教室里，彩色拉花挂满日光灯，黑板写着“文化祭筹备大会”。"},{"type":"dialogue","speaker":"char4","text":"杰哥，你当负责人，咱班节目可不能输给隔壁班啊。","pose":"center","sprite":"s2","enter":false,"exit":false,"spriteScale":1.6,"spriteY":8},{"type":"narration","text":"李杰站在讲台边，拿着皱巴巴的报名表，笑容有点紧张。"},{"type":"dialogue","speaker":"char1","text":"第一次当负责人，压力山大，大家多出主意。","pose":"center","sprite":"calm","enter":false,"exit":false},{"type":"dialogue","speaker":"char5","text":"要我说，搞个恋爱反转短剧，保证笑翻全场。","pose":"center","sprite":"s2","enter":false,"exit":false},{"type":"narration","text":"猴子挤眉弄眼，刚子跟着起哄，教室里一片闹腾。"},{"type":"dialogue","speaker":"char1","text":"这个……会不会太闹了啊 <script>
/* ============================================================================
 * Galgame 独立播放器引擎（单文件 / 零依赖 / 原生 ES2020+）
 * 数据来源：上方 id="galgame-data" 的 JSON 脚本块（由打包器整体替换占位符）
 * 模块顺序：Util → Data → Persist → State → Render → Input → Boot
 * ========================================================================== */
(function () {
  'use strict';

  /* ==========================================================================
   * 模块 0 · Util —— 通用小工具
   * ========================================================================== */
  const $ = (sel) => document.querySelector(sel);

  /** HTML 转义，所有用户数据都经此进入 innerHTML */
  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /** 取字符串字段，非法则回退 */
  function str(v, fb = '') { return typeof v === 'string' ? v : (v == null ? fb : String(v)); }
  /** 取负整数（数组下标 / 索引） */
  function int(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? Math.trunc(n) : fb; }
  /** 取正数（时间间隔等） */
  function num(v, fb = 0) { const n = Number(v); return Number.isFinite(n) ? n : fb; }
  /** 取对象，非对象则回退空对象 */
  function obj(v) { return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
  /** 取数组，非数组则回退空数组 */
  function arr(v) { return Array.isArray(v) ? v : []; }
  /** 深拷贝（数据来自 JSON，结构安全） */
  function clone(v) { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return null; } }

  /** 统一时间戳格式：2026-10-02 20:13 */
  function fmtTime(ts) {
    const n = num(ts, 0);
    if (!n) return '—';
    const d = new Date(n);
    if (isNaN(d.getTime())) return '—';
    const p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /** localStorage 安全包装：无痕模式 / file:// 受限时降级为内存存储 */
  const memStore = Object.create(null);
  const LS = {
    available: (function () {
      try { const k = '__galgame_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
      catch (e) { return false; }
    })(),
    get(k) { try { return this.available ? localStorage.getItem(k) : (k in memStore ? memStore[k] : null); } catch (e) { return null; } },
    set(k, v) { try { if (this.available) localStorage.setItem(k, v); else memStore[k] = v; } catch (e) { memStore[k] = v; } },
    del(k) { try { if (this.available) localStorage.removeItem(k); else delete memStore[k]; } catch (e) { delete memStore[k]; } },
    /** 读 JSON，解析失败返回 fallback */
    getJSON(k, fb) {
      const raw = this.get(k);
      if (!raw) return fb;
      try { const v = JSON.parse(raw); return v == null ? fb : v; } catch (e) { return fb; }
    },
    setJSON(k, v) { this.set(k, JSON.stringify(v)); }
  };

  /* localStorage 键名（按作品标题隔离，避免多部作品互相覆盖） */
  const KEY = {
    settings: 'galgame.settings.v1',
    audio: 'galgame.audio.v1',
    autosave: 'galgame.save.auto.v1',
    slot: (i) => `galgame.save.slot${i}.v1`,
    gallery: 'galgame.gallery.v1',
    read: 'galgame.read.v1'
  };

  /* ==========================================================================
   * 模块 1 · Data —— 读取并规范化数据契约（Story Schema v1）
   * 规范化原则：任何缺失 / 类型错误都降级为安全值，绝不抛错白屏
   * ========================================================================== */
  /**
   * 打包器会把**重复出现的**内联素材（同一段 BGM 挂在多幕上之类）抽成
   * id="galgame-assets" 里的共享池，正文只留 "\u0000asset#N" 这样的引用。
   * 这里在读数据时还原回去，引擎其余部分完全不用知道池子的存在。
   */
  const ASSET_REF = /^\u0000asset#(\d+)$/;

  function resolveSharedAssets(v, pool) {
    if (typeof v === 'string') {
      const m = ASSET_REF.exec(v);
      return m ? (pool[v] !== undefined ? pool[v] : v) : v;
    }
    if (Array.isArray(v)) {
      for (let i = 0; i < v.length; i++) v[i] = resolveSharedAssets(v[i], pool);
      return v;
    }
    if (v && typeof v === 'object') {
      for (const k of Object.keys(v)) v[k] = resolveSharedAssets(v[k], pool);
      return v;
    }
    return v;
  }

  function readRawData() {
    const el = document.getElementById('galgame-data');
    if (!el) return { ok: false, err: '缺少数据容器（galgame-data）' };
    const text = (el.textContent || '').trim();
    if (!text) return { ok: false, err: '数据为空：打包器尚未注入剧本 JSON' };
    try {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object') return { ok: false, err: '剧本 JSON 顶层不是对象' };
      // 还原被抽取的共享素材（没有池子时是 null，直接跳过）
      try {
        const poolEl = document.getElementById('galgame-assets');
        if (poolEl) {
          const poolText = (poolEl.textContent || '').trim();
          if (poolText && poolText !== 'null') {
            const pool = JSON.parse(poolText);
            if (pool && typeof pool === 'object') resolveSharedAssets(parsed, pool);
          }
        }
      } catch (e) { /* 池子坏了不该让整个游戏起不来，正文里仍留着引用串 */ }
      return { ok: true, data: parsed };
    } catch (e) {
      return { ok: false, err: '剧本 JSON 解析失败：' + (e && e.message ? e.message : e) };
    }
  }

  const CELL_COUNT = 12; // placeholder.gradient 被切分的色标格子数

  /** 把 gradient 字符串切成若干色，供占位立绘上色 */
  function parseGradientColors(gradient, fb) {
    const s = str(gradient, '');
    const hexes = s.match(/#[0-9a-fA-F]{3,8}\b/g) || [];
    const rgbas = s.match(/rgba?\([^)]*\)/g) || [];
    const list = hexes.concat(rgbas).map((c) => c.trim());
    if (!list.length) return { colors: [], raw: '' };
    const out = [];
    for (let i = 0; i < CELL_COUNT; i++) out.push(list[Math.min(list.length - 1, Math.floor(i * list.length / CELL_COUNT))]);
    return { colors: out, raw: list[list.length - 1], first: list[0] };
  }

  /* ---- v2 条件（endings[].condition / choice.options[].require 共用同一套结构） ---- */
  const COND_OPS = ['>=', '>', '<=', '<', '==', '!='];

  /**
   * 规范化条件数组：只保留合法项（var 非空、op 受支持）。
   * 非法项被丢弃并写入 warnings（不阻断播放）。
   */
  function normalizeConditions(list, where) {
    const out = [];
    arr(list).forEach((c, i) => {
      if (!c || typeof c !== 'object') return;
      const v = str(c.var, '');
      const op = str(c.op, '');
      if (!v) return;
      if (COND_OPS.indexOf(op) < 0) return;
      out.push({ var: v, op, value: ('value' in c) ? c.value : 0 });
    });
    return out;
  }

  /**
   * 条件求值：变量不存在按 0 处理；全部条件 AND。
   * 返回 { ok, results:[{var,op,value,actual,pass}] }
   */
  function evalConditions(list) {
    const results = arr(list).map((c) => {
      const actual = (c.var in State.vars) ? State.vars[c.var] : 0;
      return { var: c.var, op: c.op, value: c.value, actual, pass: compareVars(actual, c.op, c.value) };
    });
    return { ok: results.every((r) => r.pass), results };
  }

  /** 单次比较；类型不可比时退回宽松比较，仍不可比则判不成立 */
  function compareVars(actual, op, expected) {
    if (op === '==') return looseEq(actual, expected);
    if (op === '!=') return !looseEq(actual, expected);
    const a = Number(actual), b = Number(expected);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return false;
    if (op === '>=') return a >= b;
    if (op === '>') return a > b;
    if (op === '<=') return a <= b;
    if (op === '<') return a < b;
    return false;
  }
  /** 宽松相等：'1'==1、1==true、true=='true' 均成立（作者手写 JSON 常见写法） */
  function looseEq(a, b) {
    if (a === b) return true;
    if (typeof a === 'number' || typeof b === 'number') return Number(a) === Number(b);
    if (typeof a === 'boolean' || typeof b === 'boolean') return String(a) === String(b);
    return String(a) === String(b);
  }

  /** 条件可读化：affection.yuki >= 10 → 「affection.yuki ≥ 10」 */
  const OP_CN = { '>=': '≥', '>': '>', '<=': '≤', '<': '<', '==': '=', '!=': '≠' };
  function condText(c, withActual) {
    const op = OP_CN[str(c.op, '')] || str(c.op, '');
    const base = `${str(c.var, '')} ${op} ${fmtVar(c.value)}`;
    return withActual ? `${base}（当前 ${fmtVar(c.actual)}）` : base;
  }

  /* ---- v3 立绘变换 / 音频 的取值工具 ---- */
  /** 夹到 [min,max]；非数字回退默认值 */
  function clampNum(v, min, max, fb) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fb;
    return Math.min(max, Math.max(min, n));
  }
  function clamp01(v, fb) {
    const n = Number(v);
    if (!Number.isFinite(n)) return fb;
    return Math.min(1, Math.max(0, n));
  }
  /**
   * 音频只接受 data:audio/... 的 data URL（防外链与注入），其它一律 null。
   * 返回值统一带 `data` 与 `key`（key 用于"同一首不重头播"的判断）。
   */
  function normAudio(v) {
    const s = str(v, '');
    if (!s) return null;
    // 明确挡掉可执行协议
    if (/^\s*(javascript|vbscript):/i.test(s)) return null;
    // 支持两种来源：
    //   1. 内联 data URL —— 单文件自包含产物的形态；
    //   2. **相对路径 / http(s) 链接** —— 素材拆成独立文件的部署版形态
    //      （静态托管下这样首屏更快、素材能被浏览器单独缓存）。
    const looksLikeAudio = s.indexOf('data:audio/') === 0
      || /^(https?:)?\/\//i.test(s)
      || /\.(mp3|m4a|aac|ogg|oga|opus|wav|webm|flac)(\?|#|$)/i.test(s);
    if (!looksLikeAudio) return null;
    return { data: s, key: lineHash('audio', 0, s.slice(0, 96) + ':' + s.length) };
  }
  /** 立绘变换：角色级默认值，被行级同名字段覆盖 */
  function spriteTransformOf(ch, line) {
    const o = obj(line);
    const pick = (field) => {
      const v = o[field];
      const n0 = Number(v);
      if (v !== undefined && v !== null && v !== '' && Number.isFinite(n0)) return { v: n0, from: 'line' };
      const c = Number(obj(ch)[field]);
      if (Number.isFinite(c)) return { v: c, from: 'char' };
      return { v: null, from: 'none' };
    };
    const sc = pick('spriteScale');
    const sx = pick('spriteX');
    const sy = pick('spriteY');
    return {
      scale: clampNum(sc.v, 0.4, 2.0, 1),
      x: clampNum(sx.v, -50, 50, 0),
      y: clampNum(sy.v, -30, 30, 0),
      src: { scale: sc.from, x: sx.from, y: sy.from }
    };
  }
  /** 变换串：位移百分比相对立绘自身尺寸（translate 的百分比基准就是元素自身） */
  function transformStr(t) {
    return `translate(${t.x}%, ${t.y}%) scale(${t.scale})`;
  }

  function normalizeData(raw) {
    const meta = obj(raw.meta);
    const theme = obj(meta.theme);
    const data = {
      meta: {
        title: str(meta.title, '未命名作品'),
        subtitle: str(meta.subtitle, ''),
        author: str(meta.author, ''),
        version: str(meta.version, ''),
        createdAt: str(meta.createdAt, ''),
        language: str(meta.language, 'zh-CN'),
        synopsis: str(meta.synopsis, ''),
        tags: arr(meta.tags).map((t) => str(t, '')).filter(Boolean),
        cover: typeof meta.cover === 'string' && meta.cover ? meta.cover : null,   // v2 封面图（data URL）
        affectionMax: Math.max(1, num(meta.affectionMax, 20)),                     // v2 好感度量程
        bgmVolume: clamp01(meta.bgmVolume, 0.6),                                   // v3 全局背景音音量
        voiceVolume: clamp01(meta.voiceVolume, 0.9),                               // v3 全局语音音量
        theme: {
          primary: str(theme.primary, '') || '#ff8fb1',
          accent: str(theme.accent, '') || '#8fb1ff',
          bg: str(theme.bg, '') || '#101425'
        }
      },
      characters: [],
      backgrounds: [],
      scenes: [],
      endings: [],
      start: str(raw.start, ''),
      warnings: []
    };

    // ---- 角色 ----
    arr(raw.characters).forEach((c, i) => {
      if (!c || typeof c !== 'object') { data.warnings.push(`characters[${i}] 不是对象，已跳过`); return; }
      const id = str(c.id, '');
      if (!id) { data.warnings.push(`characters[${i}] 缺少 id，已跳过`); return; }
      const ph = obj(c.placeholder);
      const grad = parseGradientColors(ph.gradient, null);
      data.characters.push({
        id,
        name: str(c.name, id),
        color: str(c.color, '') || data.meta.theme.primary,
        role: str(c.role, ''),
        profile: str(c.profile, ''),
        sprites: obj(c.sprites),
        // v2：好感度变量名（缺省约定 affection.<id>）与显示名
        // v4：不可攻略角色没有好感度系统（后端归一化后 romanceable:false 且 affectionKey 为空）
        romanceable: c.romanceable !== false,
        affectionKey: str(c.affectionKey, '') || ('affection.' + id),
        affectionLabel: str(c.affectionLabel, '') || '好感度',
        // v3：立绘默认变换
        spriteScale: clampNum(c.spriteScale, 0.4, 2.0, 1),
        spriteX: clampNum(c.spriteX, -50, 50, 0),
        spriteY: clampNum(c.spriteY, -30, 30, 0),
        placeholder: {
          emoji: str(ph.emoji, '👤'),
          gradient: str(ph.gradient, ''),
          colors: grad.colors,
          fallback: grad.colors.length ? '' : `linear-gradient(160deg,${data.meta.theme.primary},${data.meta.theme.accent})`
        }
      });
    });

    // ---- 背景 ----
    arr(raw.backgrounds).forEach((b, i) => {
      if (!b || typeof b !== 'object') { data.warnings.push(`backgrounds[${i}] 不是对象，已跳过`); return; }
      const id = str(b.id, '');
      if (!id) { data.warnings.push(`backgrounds[${i}] 缺少 id，已跳过`); return; }
      const image = typeof b.image === 'string' && b.image ? b.image : null;
      data.backgrounds.push({
        id,
        name: str(b.name, id),
        css: str(b.css, '') || `linear-gradient(180deg,${data.meta.theme.bg},#1c2140)`,
        image
      });
    });

    // ---- 场景 ----
    arr(raw.scenes).forEach((s, i) => {
      if (!s || typeof s !== 'object') { data.warnings.push(`scenes[${i}] 不是对象，已跳过`); return; }
      const id = str(s.id, '');
      if (!id) { data.warnings.push(`scenes[${i}] 缺少 id，已跳过`); return; }
      data.scenes.push({
        id,
        chapter: int(s.chapter, 0),
        name: str(s.name, id),
        background: str(s.background, ''),
        // v3：场景背景音
        bgm: normAudio(s.bgm),
        bgmName: str(s.bgmName, ''),
        bgmVolume: (s.bgmVolume === undefined || s.bgmVolume === null) ? null : clamp01(s.bgmVolume, 0.6),
        bgmLoop: s.bgmLoop === false ? false : true,
        lines: arr(s.lines).filter((l) => l && typeof l === 'object')
      });
    });

    // ---- 结局 ----
    const KINDS = ['true', 'good', 'normal', 'bad'];
    arr(raw.endings).forEach((e, i) => {
      if (!e || typeof e !== 'object') { data.warnings.push(`endings[${i}] 不是对象，已跳过`); return; }
      const id = str(e.id, '');
      if (!id) { data.warnings.push(`endings[${i}] 缺少 id，已跳过`); return; }
      const kind = str(e.kind, 'normal');
      data.endings.push({
        id,
        title: str(e.title, '结局'),
        text: str(e.text, ''),
        kind: KINDS.indexOf(kind) >= 0 ? kind : 'normal',
        // v2：触发条件（数组内 AND；空数组/省略 = 无条件）
        condition: normalizeConditions(e.condition, `endings[${i}](${id})`)
      });
    });

    // ---- 索引表（快速查找） ----
    data.charMap = Object.create(null);
    data.characters.forEach((c) => { if (!(c.id in data.charMap)) data.charMap[c.id] = c; });
    data.bgMap = Object.create(null);
    data.backgrounds.forEach((b) => { if (!(b.id in data.bgMap)) data.bgMap[b.id] = b; });
    data.sceneMap = Object.create(null);
    data.scenes.forEach((s) => { if (!(s.id in data.sceneMap)) data.sceneMap[s.id] = s; });
    data.endingMap = Object.create(null);
    data.endings.forEach((e) => { if (!(e.id in data.endingMap)) data.endingMap[e.id] = e; });

    // ---- 契约自检（只提示，不阻断） ----
    if (!data.start || !data.sceneMap[data.start]) {
      data.warnings.push(`start 场景「${data.start || '空'}」不存在`);
      data.start = data.scenes.length ? data.scenes[0].id : '';
    }
    if (!data.characters.length) data.warnings.push('characters 为空：台词将只显示文本');
    if (!data.scenes.length) data.warnings.push('scenes 为空：无法开始游戏');
    data.scenes.forEach((s) => {
      if (s.background && !data.bgMap[s.background]) {
        data.warnings.push(`场景 ${s.id} 的背景「${s.background}」不存在，已回退默认背景`);
      }
      s.lines.forEach((l, li) => {
        if (str(l.type, '') === 'choice') {
          arr(l.options).forEach((o, oi) => {
            const oo = obj(o);
            if (!o || typeof o !== 'object') { data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 不是对象，已跳过`); return; }
            const g = str(oo.goto, '');
            // v2：goto / ending 都为空是合法的（顺延到下一个场景）
            if (g && !data.sceneMap[g]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 goto「${g}」不存在`);
            const en = str(oo.ending, '');
            if (en && !data.endingMap[en]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 ending「${en}」不存在`);
            const req = normalizeConditions(oo.require, `choice.require`);
            if (req.length !== arr(oo.require).length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行选项 ${oi + 1} 的 require 有非法条件，已忽略`);
          });
        }
        if (str(l.type, '') === 'ending') {
          if (l.byCondition === true) {
            if (!data.endings.length) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行用了 byCondition，但没有任何结局定义`);
          } else {
            const eid = str(l.endingId, '');
            if (!eid || !data.endingMap[eid]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 endingId「${eid || '空'}」不存在`);
          }
        }
        if (str(l.type, '') === 'dialogue') {
          const sp = str(l.speaker, '');
          if (sp && !data.charMap[sp]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 speaker「${sp}」不存在`);
        }
        // v2 行级背景覆盖：id 不存在只提示，播放时自动沿用场景背景
        if (str(l.type, '') !== 'ending') {
          const lb = str(l.background, '');
          if (lb && !data.bgMap[lb]) data.warnings.push(`场景 ${s.id} 第 ${li + 1} 行的 background「${lb}」不存在，已沿用场景背景`);
        }
      });
    });
    return data;
  }

  /* ==========================================================================
   * 模块 2 · Persist —— 设置 / 存档 / 图鉴 / 已读 的读写
   * ========================================================================== */
  const DEFAULT_SETTINGS = {
    textSpeed: 'medium',      // slow | medium | fast | instant
    fontSize: 'medium',       // small | medium | large
    autoPlay: false,
    autoInterval: 2200,       // ms
    skipRead: false           // 跳过已读（已读文本瞬间显示）
  };
  /* v3 音频默认值（真实初值在 init 里按 meta.bgmVolume / meta.voiceVolume 覆盖） */
  const DEFAULT_AUDIO = { bgmVolume: 0.6, voiceVolume: 0.9, mute: false };
  const SPEED_MS = { slow: 68, medium: 34, fast: 16, instant: 0 };

  const Persist = {
    /** v3：音频设置单独存一个键，避免被"重置全部数据"之外的地方覆盖 */
    readAudioSettings() {
      const a = obj(LS.getJSON(KEY.audio, null) || {});
      const out = {
        bgmVolume: clamp01(a.bgmVolume, DEFAULT_AUDIO.bgmVolume),
        voiceVolume: clamp01(a.voiceVolume, DEFAULT_AUDIO.voiceVolume),
        mute: typeof a.mute === 'boolean' ? a.mute : false
      };
      out.__saved = (typeof a.bgmVolume === 'number' || typeof a.voiceVolume === 'number' || typeof a.mute === 'boolean');
      return out;
    },
    writeAudioSettings() {
      LS.setJSON(KEY.audio, {
        bgmVolume: State.audio.bgmVolume,
        voiceVolume: State.audio.voiceVolume,
        mute: State.audio.mute
      });
    },
    readSettings() {
      const s = obj(LS.getJSON(KEY.settings, {}));
      const out = Object.assign({}, DEFAULT_SETTINGS);
      if (['slow', 'medium', 'fast', 'instant'].indexOf(s.textSpeed) >= 0) out.textSpeed = s.textSpeed;
      if (['small', 'medium', 'large'].indexOf(s.fontSize) >= 0) out.fontSize = s.fontSize;
      if (typeof s.autoPlay === 'boolean') out.autoPlay = s.autoPlay;
      if (typeof s.skipRead === 'boolean') out.skipRead = s.skipRead;
      const iv = num(s.autoInterval, DEFAULT_SETTINGS.autoInterval);
      out.autoInterval = Math.min(8000, Math.max(600, iv));
      return out;
    },
    writeSettings() { LS.setJSON(KEY.settings, State.settings); },

    readGallery() {
      const g = LS.getJSON(KEY.gallery, {});
      const out = {};
      if (g && typeof g === 'object' && !Array.isArray(g)) {
        Object.keys(g).forEach((k) => {
          const v = g[k];
          out[k] = { at: num(obj(v).at, 0), title: str(obj(v).title, '') };
        });
      }
      return out;
    },
    writeGallery() { LS.setJSON(KEY.gallery, State.gallery); },

    readSlot(i) {
      const o = LS.getJSON(KEY.slot(i), null);
      return o && typeof o === 'object' ? o : null;
    },
    readAuto() {
      const o = LS.getJSON(KEY.autosave, null);
      return o && typeof o === 'object' ? o : null;
    },

    readRead() {
      const r = LS.getJSON(KEY.read, []);
      const out = [];
      if (Array.isArray(r)) r.forEach((x) => { if (typeof x === 'string') out.push(x); });
      return out;
    },
    writeRead() {
      const list = Array.from(State.readSet);
      // 上限 4000 条，超出丢最早的，避免 localStorage 膨胀
      LS.setJSON(KEY.read, list.slice(-4000));
    }
  };

  /* 已读标记：用低成本哈希标识一行文本 */
  function lineHash(sceneId, idx, text) {
    const s = sceneId + '|' + idx + '|' + text;
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }
